# Publish the game to GitHub Pages on every push to main.
#
# The game is already a static site at the repo root — index.html plus src/ and
# vendor/, no build step and nothing fetched at runtime — so this uploads the
# tree as-is.
#
# `enablement: true` asks GitHub to switch Pages on from inside the run. On this
# repository that is REFUSED — the run fails with "Create Pages site failed:
# Resource not accessible by integration", because the automatic GITHUB_TOKEN
# cannot create a Pages site. The first enablement has to be done by a person,
# once:
#
#     Settings -> Pages -> Build and deployment -> Source: GitHub Actions
#
# Pick "GitHub Actions", NOT "Deploy from a branch" — a branch deploy would
# serve the site without this workflow and leave it failing on every push.
# Once the source is set, this keeps the site current by itself and the
# enablement flag below becomes a no-op.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let a newer push win, but don't cancel one that is
# already mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
